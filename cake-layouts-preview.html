<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cake page layouts — pick one</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#ff5fa2;--gold:#ffd166;--purple:#9b5de5;--ah:150px}
body{font-family:'Poppins',sans-serif;background:linear-gradient(180deg,#12082a,#070414 45%,#12082a);color:#fff;min-height:100vh;padding:24px 14px 80px}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(28px,6vw,42px);text-align:center;margin-bottom:6px;background:linear-gradient(90deg,#ffd166,#ff5fa2,#c9b0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{text-align:center;opacity:.78;font-size:14px;margin:0 auto 26px;max-width:560px;line-height:1.5}
.grid{display:grid;gap:26px;max-width:920px;margin:0 auto}
.card{border:1px solid rgba(255,255,255,.1);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.035);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.28)}
.bar b{font-size:15px;display:block}
.bar small{opacity:.65;font-size:12px;line-height:1.4}
.pick{flex:none;border:none;border-radius:999px;padding:9px 14px;font:700 12px Poppins,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple))}
.note{padding:10px 16px 14px;font-size:12px;opacity:.7;line-height:1.4}

/* party stage — matches live site vibe, characters are stickers not cards */
.stage{position:relative;height:460px;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,rgba(155,93,229,.28),transparent 55%),#0a0518}
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff8,transparent),radial-gradient(1px 1px at 78% 18%,#fff6,transparent),radial-gradient(1.5px 1.5px at 42% 70%,#fff5,transparent),radial-gradient(1px 1px at 88% 62%,#fff7,transparent),radial-gradient(1px 1px at 22% 84%,#fff4,transparent)}
.stage.picked{outline:3px solid var(--gold);outline-offset:-3px}

.av{position:absolute;display:flex;flex-direction:column;align-items:center;height:var(--ah);pointer-events:none}
.av img{display:block;height:100%;width:auto;object-fit:contain;mix-blend-mode:lighten;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55));transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite}
.av:nth-child(2n) img{animation-delay:-1.2s}
.av .tag{font-size:11px;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 2px #000,0 0 6px #000;margin-bottom:2px;white-space:nowrap}
.av.king{height:calc(var(--ah) * 1.12)}
.av.king .tag{color:var(--gold)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.cake{position:absolute;left:50%;transform:translateX(-50%);z-index:5;width:118px}
.cake .candles{display:flex;justify-content:center;gap:8px;margin-bottom:2px}
.cake .candle{width:6px;height:18px;background:#fff3c4;border-radius:2px;position:relative}
.cake .candle::after{content:'';position:absolute;top:-8px;left:50%;width:8px;height:10px;margin-left:-4px;border-radius:50% 50% 40% 40%;background:radial-gradient(#fff,#ffd166 40%,#ff7a00);animation:flick .2s infinite alternate}
@keyframes flick{to{transform:scaleY(.85)}}
.cake .t3{height:22px;width:55%;margin:0 auto;border-radius:8px 8px 2px 2px;background:linear-gradient(#c9b0ff,#9b5de5);border:2px solid #7a3fc0}
.cake .t2{height:28px;width:78%;margin:0 auto;border-radius:8px 8px 2px 2px;background:linear-gradient(#ffe08a,#ffb347);border:2px solid #e09a2e}
.cake .t1{height:36px;border-radius:8px 8px 4px 4px;background:linear-gradient(#fff,#ffd6ea);border:2px solid #f5b8d4;display:grid;place-items:center;font-family:Pacifico,cursive;color:#9b2c62;font-size:13px}
.cake .plate{height:10px;border-radius:50%;background:#ddd;box-shadow:0 6px 0 #aaa;margin-top:-4px}

/* L1 classic rows */
#l1 .row{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:2px;z-index:4}
#l1 .top{top:6%;height:145px}
#l1 .bot{bottom:4%;height:165px}
#l1 .row .av{position:relative;height:100%}
#l1 .bot .av.king{height:115%}
#l1 .cake{bottom:34%}

/* L2 arc */
#l2 .av{height:125px;bottom:10%}
#l2 .av[data-n="Viraj"]{left:2%;bottom:26%;transform:rotate(-6deg)}
#l2 .av[data-n="Nancy"]{left:14%;bottom:40%}
#l2 .av[data-n="Alaric"]{left:28%;bottom:48%}
#l2 .av[data-n="Fluffy"]{right:28%;bottom:48%;left:auto}
#l2 .av[data-n="Kashie"]{right:14%;bottom:40%;left:auto}
#l2 .av[data-n="Mctominay"]{right:2%;bottom:24%;left:auto;height:140px;transform:rotate(6deg)}
#l2 .cake{bottom:8%;width:128px;z-index:6}

/* L3 huddle */
#l3 .av{height:120px}
#l3 .av[data-n="Viraj"]{left:16%;bottom:36%;z-index:3;height:110px}
#l3 .av[data-n="Nancy"]{left:28%;bottom:28%;z-index:4}
#l3 .av[data-n="Alaric"]{left:20%;bottom:10%;z-index:5;height:128px}
#l3 .av[data-n="Fluffy"]{right:20%;bottom:10%;left:auto;z-index:5;height:128px}
#l3 .av[data-n="Kashie"]{right:28%;bottom:28%;left:auto;z-index:4}
#l3 .av[data-n="Mctominay"]{right:16%;bottom:36%;left:auto;z-index:3;height:132px}
#l3 .cake{bottom:20%;width:112px;z-index:6}

/* L4 spotlight */
#l4 .av[data-n="Mctominay"]{left:50%;bottom:6%;height:210px;transform:translateX(-50%);z-index:6}
#l4 .av[data-n="Viraj"]{left:4%;bottom:16%;height:120px}
#l4 .av[data-n="Nancy"]{left:18%;bottom:30%;height:125px}
#l4 .av[data-n="Alaric"]{left:6%;bottom:48%;height:115px}
#l4 .av[data-n="Fluffy"]{right:6%;bottom:48%;left:auto;height:115px}
#l4 .av[data-n="Kashie"]{right:18%;bottom:30%;left:auto;height:125px}
#l4 .cake{left:74%;bottom:10%;width:100px;transform:none;z-index:5}

/* L5 layered */
#l5 .av{height:122px}
#l5 .av.back{z-index:2;filter:brightness(.95)}
#l5 .av.front{z-index:6}
#l5 .av[data-n="Viraj"]{left:8%;bottom:40%}
#l5 .av[data-n="Nancy"]{left:26%;bottom:46%}
#l5 .av[data-n="Alaric"]{right:26%;bottom:46%;left:auto}
#l5 .av[data-n="Fluffy"]{right:8%;bottom:40%;left:auto}
#l5 .av[data-n="Kashie"]{left:20%;bottom:6%;height:135px}
#l5 .av[data-n="Mctominay"]{right:20%;bottom:4%;left:auto;height:150px}
#l5 .cake{bottom:22%;width:124px;z-index:4}

/* L6 row */
#l6 .row{position:absolute;left:1%;right:1%;bottom:32%;height:155px;display:flex;justify-content:center;align-items:flex-end;gap:0;z-index:5}
#l6 .row .av{position:relative;height:100%;flex:1;max-width:115px}
#l6 .row .av.king{height:118%;max-width:135px}
#l6 .cake{bottom:4%;width:140px;z-index:3}

@media(max-width:640px){
  .stage{height:400px}
  :root{--ah:120px}
  #l1 .top{height:115px}#l1 .bot{height:135px}
  #l6 .row{height:125px}
}
</style>
</head>
<body>
  <h1>Cake page layouts</h1>
  <p class="lead">Hand-drawn stickers made <b>from</b> your Roblox refs (not the photos). Floating characters like the main site — no cards. Pick a number.</p>
  <div class="grid" id="grid"></div>
<script>
const BASE = location.pathname.includes('mctominay-birthday') ? 'characters/drawn/' : 'public/characters/drawn/';
const CHAR = [
  {n:'Viraj', f:'viraj.png'},
  {n:'Nancy', f:'nancy.png'},
  {n:'Alaric', f:'alaric.png'},
  {n:'Fluffy', f:'fluffy.png'},
  {n:'Mctominay', f:'mctominay.png', king:1},
  {n:'Kashie', f:'kashie.png'},
];
const LAYOUTS = [
  {id:'l1', title:'1 · Classic two rows', blurb:'Like the live party page: top squad, cake, birthday kid bigger on bottom.'},
  {id:'l2', title:'2 · Arc around cake', blurb:'Friends curve around the cake like a group photo.'},
  {id:'l3', title:'3 · Tight huddle', blurb:'Cozy surprise pile-on around the cake.'},
  {id:'l4', title:'4 · Spotlight McTominay', blurb:'Birthday kid huge center, friends smaller on sides.'},
  {id:'l5', title:'5 · Layered depth', blurb:'Some behind the cake, two in front — more depth.'},
  {id:'l6', title:'6 · Squad row + cake', blurb:'One clean sticker row above a big cake.'},
];
const cake = () => `<div class="cake"><div class="candles"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="t3"></div><div class="t2"></div><div class="t1">Mcto</div><div class="plate"></div></div>`;
const av = (c, extra='') => `<div class="av${c.king?' king':''}${extra?' '+extra:''}" data-n="${c.n}"><div class="tag">${c.king?c.n+' 🎂':c.n}</div><img src="${BASE+c.f}" alt="${c.n}"/></div>`;

const grid = document.getElementById('grid');
LAYOUTS.forEach((L, i) => {
  let inner = '';
  if (L.id==='l1') {
    const top = CHAR.filter(c=>['Viraj','Nancy','Alaric'].includes(c.n));
    const bot = CHAR.filter(c=>['Fluffy','Mctominay','Kashie'].includes(c.n));
    inner = `<div class="row top">${top.map(c=>av(c)).join('')}</div>${cake()}<div class="row bot">${bot.map(c=>av(c)).join('')}</div>`;
  } else if (L.id==='l6') {
    const order = ['Viraj','Nancy','Alaric','Mctominay','Fluffy','Kashie'].map(n=>CHAR.find(c=>c.n===n));
    inner = `<div class="row">${order.map(c=>av(c)).join('')}</div>${cake()}`;
  } else if (L.id==='l5') {
    inner = CHAR.map(c=>av(c, ['Viraj','Nancy','Alaric','Fluffy'].includes(c.n)?'back':'front')).join('') + cake();
  } else {
    inner = CHAR.map(c=>av(c)).join('') + cake();
  }
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `<div class="bar"><div><b>${L.title}</b><small>${L.blurb}</small></div><button class="pick" data-id="${i+1}">Pick this</button></div><div class="stage" id="${L.id}">${inner}</div><p class="note">Redrawn characters · hand poses · sticker cutouts</p>`;
  grid.appendChild(el);
});
grid.onclick = e => {
  const b = e.target.closest('.pick'); if(!b) return;
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('picked'));
  document.getElementById('l'+b.dataset.id)?.classList.add('picked');
  grid.querySelectorAll('.pick').forEach(x=>x.textContent='Pick this');
  b.textContent='Selected ✓';
};
</script>
</body>
</html>
